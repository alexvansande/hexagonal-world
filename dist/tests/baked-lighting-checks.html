<!doctype html><meta charset="utf-8"><title>Baked lighting checks</title>
<style>body{margin:0}iframe{border:0}</style><iframe title="Lighting preview"></iframe><pre id="result">Loading…</pre>
<script>
const frame=document.querySelector('iframe'),desktop=new URLSearchParams(location.search).has('desktop');frame.width=desktop?1200:390;frame.height=desktop?900:844;frame.src='../index.html';
frame.onload=async()=>{
 const d=frame.contentDocument,w=frame.contentWindow,results=[],pause=ms=>new Promise(r=>setTimeout(r,ms));
 const until=async predicate=>{for(let i=0;i<300;i++){if(predicate())return;await pause(100);}throw Error('Timed out: '+d.querySelector('#relief-status').textContent);};
 const check=(ok,message)=>{if(!ok)throw Error(message);results.push(message);};
 try{
 await until(()=>d.querySelector('#relief-status').textContent.includes('Precomputed')&&d.querySelector('#map-loading').textContent==='');
 for(const card of d.querySelectorAll('.style-preset-card')){
  card.click();await until(()=>d.querySelector('#map-loading').textContent==='');
  if(d.querySelector('#relief-enabled').checked)await until(()=>d.querySelector('#relief-status').textContent.includes('Precomputed'));
  check(d.querySelector('#error').hidden,card.getAttribute('aria-label')+' rendered');
 }
 const cards=[...d.querySelectorAll('.style-preset-card')];cards[0].click();cards[2].click();cards[6].click();cards[0].click();
 await until(()=>d.querySelector('#relief-status').textContent.includes('Lifezones')&&d.querySelector('#map-loading').textContent==='');await pause(300);
 const canvas=d.querySelector('#map'),before=canvas.toDataURL();d.querySelector('#relief-enabled').checked=false;d.querySelector('#relief-enabled').dispatchEvent(new w.Event('change'));await pause(200);
 check(before!==canvas.toDataURL(),'Baked lighting changes the rendered pixels');
 cards[0].click();await pause(300);
 const resources=w.performance.getEntriesByType('resource').map(r=>r.name);
 check(resources.some(r=>r.includes('/maps/lighting/')),'Precomputed images loaded');check(!resources.some(r=>r.includes('/maps/height/')),'Standard styles loaded no 3D height assets');
 if(!desktop)check(resources.filter(r=>r.includes('/maps/lighting/')).every(r=>r.includes('/mobile/')),'Phone loads only smaller lighting images');
 if(desktop){const slider=d.querySelector('#reliefAzimuth');slider.value=120;slider.dispatchEvent(new w.Event('input'));await until(()=>d.querySelector('#relief-status').textContent.includes('Elevation ready'));check(true,'Custom lighting falls back to live renderer');cards[0].click();await until(()=>d.querySelector('#relief-status').textContent.includes('Precomputed'));}
 document.querySelector('#result').textContent='PASS\n'+results.join('\n');
 }catch(e){document.querySelector('#result').textContent='FAIL '+e.message+'\n'+results.join('\n');}
};
</script>
