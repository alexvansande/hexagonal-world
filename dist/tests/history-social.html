<!doctype html><html lang="en"><meta charset="utf-8"><title>History social previews</title>
<style>body{font:15px system-ui;color:#234b59}iframe{width:1200px;height:630px;border:0}#previews{display:grid;grid-template-columns:repeat(3,360px);gap:16px}figure{margin:0}img{width:360px}figcaption{padding:6px;font-size:12px}</style>
<h1>History social previews</h1><p id="result">Preparing…</p><div id="previews"></div><iframe title="History artwork renderer"></iframe>
<script type="module">
import {historyPages} from '../history-routes.mjs';
import {periods} from '../history/index.mjs';
import {parsePeriod} from '../tour-content.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),params=new URLSearchParams(location.search);
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(test,label){for(let i=0;i<600;i++){if(test())return;await pause(100);}throw Error('Timed out: '+label);}
const texts=new Map();
// Sparse traffic packets vanish at thumbnail size: draw the full dotted corridor in previews.
function drawRoutes(ctx,d){
 const routes=d.querySelector('.tour-routes');if(!routes||getComputedStyle(routes).display==='none')return;
 routes.renderer.snapshot(true);ctx.drawImage(routes,0,0,1200,630);
}
// Map labels are HTML: draw them by hand in the same styles.
function drawLabels(ctx,d){
 for(const label of d.querySelectorAll('.tour-labels .tour-label:not([hidden])')){
  const x=parseFloat(label.style.left),y=parseFloat(label.style.top),site=label.dataset.kind==='site';
  ctx.save();ctx.lineJoin='round';ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.fillStyle='#000';
  if(site){ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font='700 9.5px Montserrat,"Helvetica Neue",Arial,sans-serif';ctx.textBaseline='middle';ctx.strokeText(label.textContent.toUpperCase(),x+11,y);ctx.fillText(label.textContent.toUpperCase(),x+11,y);}
  else{ctx.font='italic 22px Baskerville,Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(label.textContent,x,y);ctx.fillText(label.textContent,x,y);}
  ctx.restore();
 }
}
try{
 const pages=historyPages.filter(p=>!params.get('only')||p.path.includes(params.get('only')));let count=0;
 for(const page of pages){
  result.textContent=`Rendering ${++count}/${pages.length}: ${page.path}`;
  if(!texts.has(page.period))texts.set(page.period,parsePeriod(await (await fetch(`../history/${page.period}.md`)).text()));
  const info=periods.find(p=>p.id===page.period),text=texts.get(page.period),spot=page.spot?text.spots[page.spot]:null;
  const loaded=new Promise(resolve=>frame.onload=resolve);frame.src=page.path+'?tour-artwork=1&fresh='+Date.now();await loaded;
  const d=frame.contentDocument,map=d.querySelector('#map');
  await until(()=>d.querySelector('.history-tools')&&!d.querySelector('.history-tools').hidden&&+d.querySelector('.tour-routes')?.dataset.routeCount>0,'routes');
  if(page.spot)await until(()=>d.querySelector('#tour-story')?.hidden===false,'story');
  await pause(2200);
  await until(()=>(map.dataset.surface==='live'?!map.ownerDocument.getElementById('map-loading').textContent:(map.dataset.surfacePreview==='false'&&map.dataset.surfacePending==='0'))&&map.dataset.danceMoving!=='true','map images');
  await pause(300);
  const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=630;const ctx=canvas.getContext('2d');
  ctx.fillStyle=d.querySelector('#background-color').value;ctx.fillRect(0,0,1200,630);
  ctx.save();ctx.beginPath();ctx.rect(0,150,1200,480);ctx.clip();
  ctx.drawImage(map,0,0,1200,630);ctx.drawImage(d.querySelector('#overlay'),0,0,1200,630);
  drawRoutes(ctx,d);drawLabels(ctx,d);ctx.restore();
  ctx.fillStyle='#234b59';ctx.font='bold 13px Arial,sans-serif';ctx.letterSpacing='2px';ctx.fillText(`HEXAGONAL EARTH  /  HISTORY  /  ${info.tick.toUpperCase()}`,44,35);ctx.letterSpacing='0px';
  const title=spot?spot.title:`${info.label} · ${info.date}`;let size=52;
  do{ctx.font=`${size--}px Baskerville,Georgia,serif`;}while(ctx.measureText(title).width>1112);
  ctx.fillText(title,42,96);ctx.font='15px Arial,sans-serif';ctx.fillStyle='#486771';ctx.fillText(spot?`${info.label}, ${info.date}, on a hexagonal world map`:'Every story of the age on a hexagonal world map',44,128);
  ctx.textAlign='right';ctx.fillText('hexagonal.earth'+page.path,1156,128);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
  const image=document.createElement('img'),figure=document.createElement('figure'),caption=document.createElement('figcaption');
  image.src=URL.createObjectURL(blob);image.alt=title;caption.textContent=page.path;figure.append(image,caption);document.querySelector('#previews').append(figure);
  if(params.has('save')){const response=await fetch('http://127.0.0.1:4176'+page.image,{method:'POST',body:blob});if(!response.ok)throw Error('Could not save '+page.image);}
 }
 result.textContent=`Ready: ${count} history previews, 1200 × 630`;result.dataset.status='passed';
}catch(error){result.textContent=error.message;result.dataset.status='failed';console.error(error);}
</script></html>
