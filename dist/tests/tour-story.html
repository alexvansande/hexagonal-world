<!doctype html><html lang="en"><meta charset="utf-8"><title>Silk Road story checks</title>
<style>body{font:14px system-ui;color:#18343d}iframe{width:1100px;height:760px;border:1px solid #ccc}li{margin:5px}</style>
<h1>Silk Road story checks</h1><p id="result">Running…</p><ol id="checks"></ol>
<iframe title="Tour map" src="/lifezones/spaceship-earth/"></iframe>
<script type="module">
import {tradePeriod} from '../tour-trade-periods.mjs?v=sporadic-1';
const silkRoadTradeRoutes=tradePeriod('antiquity').routes;
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),mobile=new URLSearchParams(location.search).has('mobile');
if(mobile){frame.style.width='390px';frame.style.height='844px';}
const wait=async test=>{for(let i=0;i<300;i++){if(test())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');};
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,text)=>{if(!ok)throw Error(text);document.querySelector('#checks').insertAdjacentHTML('beforeend',`<li>PASS: ${text}</li>`);};
try{
 await wait(()=>frame.contentDocument?.querySelectorAll('.tour-marker:not([hidden])').length===5);
 const d=frame.contentDocument,win=frame.contentWindow,silk=d.querySelector('[data-tour-id="silk-road"]'),card=d.querySelector('#tour-story'),controls=d.querySelector('#controls'),routes=d.querySelector('.tour-routes'),close=d.querySelector('#tour-story-close');
 const camera=()=>d.querySelector('#zoom-value').textContent,anchor=()=>[silk.style.left,silk.style.top];
 const before={camera:camera(),anchor:anchor(),rect:controls.getBoundingClientRect()};
 check(card.hidden&&routes.style.display==='none','Story and routes are hidden initially');
 silk.click();await wait(()=>d.querySelectorAll('.route-flow .route-line').length>0);await pause(1450);
 check(!card.hidden&&getComputedStyle(card).display!=='none','Selecting Silk Road opens the story');
 check(d.activeElement===close,'Close button receives keyboard focus');
 check(d.querySelectorAll('.tour-marker:not([hidden])').length===1,'Only the selected dot remains visible');
 const flowPaths=[...routes.querySelectorAll('.route-flow .route-line')];
 check(new Set(flowPaths.map(p=>win.getComputedStyle(p).stroke)).size===5,'Five goods categories have distinct colors');
 check(card.querySelectorAll('.tour-route-key li').length===5,'Editable legend explains the five categories');
 check([...routes.querySelectorAll('g[data-route-id]')].every(g=>g.classList.contains('route-sporadic')),'Trade uses sparse packets on every branch');
 check(new Set(flowPaths.map(p=>p.style.strokeDasharray)).size>10,'Routes have independent irregular spacing');
 const moving=flowPaths[0],offset=()=>win.getComputedStyle(moving).strokeDashoffset,toggle=card.querySelector('.tour-flow-toggle');
 const startOffset=offset();await pause(180);
 if(!win.matchMedia('(prefers-reduced-motion: reduce)').matches){
  check(offset()!==startOffset,'Trade dots move in the direction of their routes');
  toggle.click();await pause(50);const frozen=offset();await pause(180);check(offset()===frozen,'Pause freezes trade flows');toggle.click();
 }else check(win.getComputedStyle(moving).animationName==='none','Reduced motion leaves static trade dots');
 const clip=d.querySelector('#tour-route-map-clip');check(clip.children.length>0,'Offset lanes are clipped to the map silhouette');

 check(routes.style.display==='block'&&routes.querySelectorAll('g[data-route-id]').length===silkRoadTradeRoutes.length,'All commodity branches are drawn');
 check(getComputedStyle(d.querySelector('.layout-presets')).display==='none'&&getComputedStyle(d.querySelector('.style-presets')).display==='none','Story replaces both option strips');
 check(parseInt(camera())>parseInt(before.camera),'Opening zooms into the network from the default view');
 const cardRect=controls.getBoundingClientRect();
 check(Math.abs(cardRect.left-before.rect.left)<1&&Math.abs(cardRect.width-before.rect.width)<1&&Math.abs(cardRect.bottom-before.rect.bottom)<1,'Card retains picker position and width');
 check(cardRect.top>=0&&cardRect.right<=win.innerWidth&&close.getBoundingClientRect().height>=44,'Card and close button fit the viewport');
 const visiblePaths=[...routes.querySelectorAll('.route-line')].map(p=>p.getBoundingClientRect());
 check(visiblePaths.every(r=>r.left>=0&&r.right<=win.innerWidth+1&&r.top>=0&&r.bottom<=win.innerHeight),'Entire route network is in the viewport');
 const path=routes.querySelector('.route-line'),oldPath=path.getAttribute('d');d.querySelector('#zoom-in').click();await pause(100);
 check(path.getAttribute('d')!==oldPath,'Routes stay attached during zoom');
 close.click();await pause(100);
 check(card.hidden&&routes.style.display==='none','X closes the card and removes all route lines');
 check(d.querySelectorAll('.tour-marker:not([hidden])').length===5,'Closing restores the other discovery dots');
 check(camera()===before.camera&&anchor().every((p,i)=>p===before.anchor[i]),'Close restores the exact previous camera');
 check(getComputedStyle(d.querySelector('.layout-presets')).display==='flex','Map options return');
 silk.click();await wait(()=>d.querySelectorAll('.route-flow .route-line').length>0);await pause(1450);d.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await pause(100);
 check(card.hidden&&d.activeElement===silk,'Escape closes and returns focus to the dot');
 silk.click();await wait(()=>d.querySelectorAll('.route-flow .route-line').length>0);await pause(1450);d.querySelector('[data-style="satellite"]').click();await pause(100);
 check(card.hidden&&routes.style.display==='none','Leaving the default style removes the story and routes');
 d.querySelector('[data-style="lifezones"]').click();await pause(100);silk.click();await wait(()=>d.querySelectorAll('.route-flow .route-line').length>0);await pause(1450);
 result.textContent='All checks passed. Story left open for visual review.';
}catch(error){result.textContent='FAIL: '+error.message;}
</script></html>
