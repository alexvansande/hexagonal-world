<!doctype html><html lang="en"><meta charset="utf-8"><title>History timeline checks</title>
<style>body{font:14px system-ui;color:#18343d}iframe{width:1100px;height:800px;border:1px solid #ccc}li{margin:4px}</style>
<h1>History timeline</h1><p id="result">Running…</p><ol id="checks"></ol>
<iframe title="Tour map"></iframe>
<script type="module">
import {periods} from '../history/index.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),mobile=new URLSearchParams(location.search).has('mobile'),full=new URLSearchParams(location.search).has('full');
// The default run is the quick one; add ?full=1 to scrub every period and drag in every direction.
// Landing pages are generated copies of the app page: load them fresh so a cached copy never runs an older app.
const fresh=path=>path+(path.includes('?')?'&':'?')+'fresh='+Date.now();
// Wait for the new document: the old one would still satisfy most conditions.
const load=async url=>{const loaded=new Promise(r=>frame.onload=r);frame.src=url;await loaded;};
await load(fresh('/lifezones/spaceship-earth/'));
if(mobile){frame.style.width='390px';frame.style.height='844px';}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test,label)=>{for(let i=0;i<400;i++){if(test())return;await pause(50);}throw Error('Timed out: '+label);};
const check=(ok,label)=>{if(!ok)throw Error(label);const li=document.createElement('li');li.textContent='PASS: '+label;document.querySelector('#checks').append(li);};
try{
 await until(()=>frame.contentDocument?.querySelectorAll('.tour-marker:not([hidden])').length===7,'map');
 let d=frame.contentDocument,w=frame.contentWindow;await pause(400);
 const toggle=d.querySelector('#show-history'),tools=d.querySelector('.history-tools'),routes=d.querySelector('.tour-routes'),viewTools=d.querySelector('.view-tools'),map=d.querySelector('#map');
 const visible=()=>[...routes.querySelectorAll('g[data-route-id]')].filter(g=>g.style.display!=='none');
 const dots=()=>[...d.querySelectorAll('.tour-marker:not([hidden])')].map(b=>b.dataset.tourId);
 const drawn=()=>visible().map(g=>g.dataset.routeId).sort().join();
 const scrub=async id=>{const previous=drawn();d.querySelector('#history-stop').value=periods.findIndex(p=>p.id===id);d.querySelector('#history-stop').dispatchEvent(new w.Event('input',{bubbles:true}));await until(()=>drawn()!==previous,'settled '+id);await pause(250);};
 check(getComputedStyle(d.querySelector('#show-history')).display!=='none'&&tools.hidden&&d.querySelector('#show-history').tagName==='BUTTON','The History button sits in the collapsed sidebar; scrubber hidden');
 check(!w.performance.getEntriesByType('resource').some(r=>/\/history\/.*\.(md|json)$/.test(r.name)),'No period data before enabling history');
 toggle.click();await until(()=>!tools.hidden&&visible().length>0,'history routes');await pause(600);
 check(getComputedStyle(viewTools).display==='none'&&!tools.hidden,'Scrubber replaces the positioning toolbox');
 const slider=d.querySelector('#history-stop');check(slider.max===String(periods.length-1)&&d.querySelectorAll('.history-stop-labels button').length===periods.length,'One tick per period');
 await until(()=>w.location.pathname==='/history/1000-ce/','default period in URL');check(w.location.hash.includes('&s=lifezones/spaceship-earth'),'The address is /history/<age>/ with style and layout in the hash');
 const middle=periods.find(p=>p.id==='1000-ce');
 check(new Set(visible().map(g=>g.dataset.routeId.split('-')[0])).size>=3,'Middle Ages draws several stories at once');
 check(dots().length===middle.stories.length&&middle.stories.every(id=>dots().includes(id)),'Story dots are the period spots');
 check(!!d.querySelector('#wave-colours')&&getComputedStyle(visible()[0]).getPropertyValue('--route-color').trim().startsWith('#'),'Wave colours come from history/waves.json');
 // Detail routes appear only when zoomed in, and hide again.
 const overview=visible().length;for(let i=0;i<3;i++)d.querySelector('#zoom-in').click();await until(()=>visible().length>overview,'detail routes');
 check(visible().length>overview,'Regional detail routes appear when zoomed in');
 for(let i=0;i<3;i++)d.querySelector('#zoom-out').click();await until(()=>visible().length===overview,'overview routes');await pause(300);
 check(visible().length===overview,'Detail routes hide again when zoomed out');
 const counts=[];
 for(const p of full?periods:periods.filter(p=>['2m-ya','10k-ya','1000-ce','1800-ce'].includes(p.id))){
  await scrub(p.id);counts.push(visible().length);
  await until(()=>w.location.pathname.startsWith('/history/'+p.id+'/'),'address for '+p.id);check(true,'Address follows '+p.id);
  check(d.querySelector('#history-date').textContent===`${p.label} · ${p.date}`&&d.querySelector(`.history-stop-labels button[data-stop="${p.id}"]`).textContent===p.tick,'Date and tick for '+p.id);
  await until(()=>visible().length>0&&dots().length>0,'routes and spots for '+p.id);
  check(dots().every(id=>p.stories.includes(id)),'Routes and spots for '+p.id+' (the headline focus may frame some dots out of view)');
  check(map.dataset.tourLayout==='dancing','Dancing pieces stay on for '+p.id);
 }
 check(new Set(counts).size>=(full?6:3),'Periods draw different networks: '+counts.join(','));
 check(routes.querySelectorAll('path').length<1800,'Route DOM stays bounded while scrubbing (three strokes per fragment)');
 // Choosing a date activates the period's headline spot: the card opens on the first story of its Markdown.
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes(full?'Galleons':'slave trade'),full?'A story focused at 1600 CE continues at 1800 CE instead of switching':'Arriving at 1800 CE from a period without the focused story opens its headline');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close auto');await pause(1500);
 await scrub('1600-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('Iberian'),'Globalization opens on the ocean crossings');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1600');await pause(1500);
 await scrub('1800-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('slave trade'),'Plantations & empires opens on the Atlantic slave trade');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1800');await pause(1500);
 // A dot frames its story for the period and shows the spot text; nothing else changes.
 await scrub('1400-ce');await pause(1300);d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1400');await pause(1500);
 const drawnBefore=visible().length,zoomBefore=d.querySelector('#zoom-value').textContent;
 d.querySelector('.tour-marker[data-tour-id="silk-road"]').click();await until(()=>!d.querySelector('#tour-story').hidden,'story');await pause(1500);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol')&&!d.querySelector('.tour-timeline')&&!d.querySelector('.tour-flow-toggle'),'Dot shows the Silk Road 1400 CE text with no second slider or pause button');
 check(!tools.hidden&&visible().length>=drawnBefore&&!d.querySelector('.history-tools button[id]'),'The scrubber and every story stay while a story is focused; no chips');
 await until(()=>w.location.pathname==='/history/1400-ce/silk-road/','pane address');check(d.querySelector('#zoom-value').textContent!==zoomBefore,'Focusing zooms to the story and the address names the pane');
 check(d.querySelectorAll('#tour-story .tour-route-key li[data-wave]').length>0,'The card lists the waves drawn for that story');
 const labels=()=>[...d.querySelectorAll('.tour-labels .tour-label:not([hidden])')];
 check(labels().some(l=>l.dataset.kind==='site'&&l.textContent==='Samarkand')&&labels().some(l=>l.dataset.kind==='area'&&l.textContent==='Steppe'),'Site and area labels of the focused story are drawn');
 check(getComputedStyle(labels().find(l=>l.dataset.kind==='site')).textTransform==='uppercase'&&getComputedStyle(labels().find(l=>l.dataset.kind==='area')).fontStyle==='italic','Sites are all caps, areas italic');
 check(parseFloat(getComputedStyle(d.querySelector('.tour-routes .route-line')).strokeWidth)<=4&&d.querySelector('.tour-routes .route-trail')&&parseFloat(getComputedStyle(d.querySelector('.tour-routes .route-trail')).strokeWidth)<parseFloat(getComputedStyle(d.querySelector('.tour-routes .route-line')).strokeWidth)&&d.querySelector('.tour-routes .route-trail').style.strokeDasharray.split(' ').length===d.querySelector('.tour-routes .route-line').style.strokeDasharray.split(' ').length,'Each dot is a bright head with a thinner faint tail on the same loop');
 // Framing a story picks the band that gathers it: the Pacific for Polynesia, the diagonal for the Atlantic.
 // (Stepping with the card's arrow: a dot framed out of view cannot be clicked.)
 d.querySelector('.tour-story-next').click();await pause(2000);await until(()=>map.dataset.danceMoving==='false','pieces settle');
 const pos=()=>Object.fromEntries(map.dataset.dancePositions.split(' ').map(s=>{const [id,rest]=s.split(':');return [id,rest.split(',').map(Number)];}));
 const adjacent=(a,b)=>Math.abs(Math.hypot(pos()[a][0]-pos()[b][0],pos()[a][1]-pos()[b][1])-Math.sqrt(3))<.01;
 check(d.querySelector('#tour-story-title').textContent.includes('Contact')&&adjacent('1','2'),'Focusing the Polynesian contact story brings South America to the Pacific piece');
 d.querySelector('.tour-story-next').click();await pause(2000);await until(()=>map.dataset.danceMoving==='false','pieces settle again');
 check(d.querySelector('#tour-story-title').textContent.includes('Vinland')&&adjacent('0','3'),'Focusing the Vinland voyages joins North America to Europe again');
 d.querySelector('.tour-story-next').click();await pause(1200);d.querySelector('.tour-story-next').click();await pause(2000);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Cycling on returns to the Silk Road');
 // Arrows at the bottom of the card cycle through the period's spots.
 check(!d.querySelector('.tour-story-nav').hidden&&d.querySelector('.tour-story-nav output').textContent==='1 / 4','The card shows its place among the period\u2019s spots');
 d.querySelector('.tour-story-next').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Contact')&&d.querySelector('.tour-story-nav output').textContent==='2 / 4','Next arrow moves to the following spot');
 d.querySelector('.tour-story-prev').click();await pause(400);d.querySelector('.tour-story-prev').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Kilwa')&&d.querySelector('.tour-story-nav output').textContent==='4 / 4','Previous arrow wraps around to the last spot');
 d.querySelector('.tour-story-next').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Cycling returns to the first spot');
 await scrub('1000-ce');
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes('caravans'),'Scrubbing re-reads the focused story at the new period');
 // A spot without routes frames its view box instead.
 await scrub('50k-ya');await pause(1600);const zoomWide=d.querySelector('#zoom-value').textContent;
 for(let i=0;i<3&&!d.querySelector('#tour-story-title').textContent.includes('floresiensis');i++){d.querySelector('.tour-story-next').click();await pause(1600);}
 const flores=d.querySelector('.tour-marker[data-tour-id="island-hominins"]').getBoundingClientRect();
 check(d.querySelector('#tour-story-title').textContent.includes('floresiensis')&&d.querySelector('#zoom-value').textContent!==zoomWide&&!flores.width===false&&flores.left>0&&flores.top>0&&flores.right<frame.clientWidth&&flores.bottom<frame.clientHeight,'A highlight spot without routes frames its view box (Flores stays on screen)');
 await scrub('2m-ya');await pause(600);
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes('Early Homo'),'A period without that story activates its first spot instead');
 await scrub('1400-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Back at 1400 CE the headline spot is the Silk Road');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'back');await pause(1500);
 check(d.querySelector('.tour-labels').hidden,'Labels leave with the card');
 await until(()=>w.location.pathname==='/history/1400-ce/','age address after close');check(visible().length>0&&d.querySelector('#zoom-value').textContent===zoomBefore,'Closing the card restores the camera at the same period and the address');
 toggle.click();await until(()=>tools.hidden&&routes.style.display==='none'&&dots().length>0,'off');await pause(200);
 check(dots().every(id=>['origin-of-mankind','silk-road','iceland-to-vinland','french-polynesia','americas-exchange','african-networks','ocean-crossings'].includes(id))&&!d.querySelector('.tour-marker[data-tour-id="neanderthals"]:not([hidden])'),'Off the timeline only the seven entry dots remain (some may sit off screen after the dance)');
 await until(()=>w.location.pathname==='/lifezones/spaceship-earth/','map address');check(getComputedStyle(viewTools).display!=='none','Unchecking restores the toolbox, dots and the map address');
 // Direct URL entry restores the period, including an older stop name.
 await load(fresh('/lifezones/spaceship-earth/?history=bronze-age'));await until(()=>frame.contentDocument?.querySelector('.history-tools')&&!frame.contentDocument.querySelector('.history-tools').hidden,'reload');
 d=frame.contentDocument;w=frame.contentWindow;await until(()=>[...d.querySelectorAll('.tour-routes g[data-route-id]')].some(g=>g.style.display!=='none'),'reload routes');await until(()=>w.location.pathname==='/history/3k-ya/','rewritten stop name');
 check(d.querySelector('#history-date').textContent.endsWith('c. 1000 BCE'),'Reload restores the Bronze Age period from its old stop name');
 // A story URL opens the timeline focused on that story.
 await load(fresh('/iceland-to-vinland/'));await until(()=>frame.contentDocument?.querySelector('#tour-story')?.hidden===false,'story URL');await pause(1800);
 // A pane address opens that age and pane directly, with the style from the hash.
 await load(fresh('/history/1600-ce/ocean-crossings/')+'#m=&s=satellite/spaceship-earth');await until(()=>frame.contentDocument?.querySelector('#tour-story')?.hidden===false&&frame.contentDocument.querySelector('#tour-story-title').textContent.includes('Iberian'),'pane address');
 check(frame.contentDocument.querySelector('#map-source').value==='marble'||frame.contentDocument.querySelector('[data-style="satellite"]'),'A pane address with &s= opens on that style');
 await load(fresh('/iceland-to-vinland/'));await until(()=>frame.contentDocument?.querySelector('#tour-story')?.hidden===false,'story URL again');await pause(1800);
 d=frame.contentDocument;w=frame.contentWindow;const first=periods.find(p=>p.stories.includes('iceland-to-vinland'));
 await until(()=>w.location.pathname===`/history/${first.id}/iceland-to-vinland/`,'story pane address');
 check(!d.querySelector('.history-tools').hidden&&d.querySelector('#tour-story-title').textContent.length>0&&[...d.querySelectorAll('.tour-marker:not([hidden])')].some(b=>b.dataset.tourId==='iceland-to-vinland'),'Story URL opens the timeline at the Vikings’ first period with the card open');
 // The dance is the map's own response to pans: after any drag the cell under the centre holds a piece.
 await load(fresh('/lifezones/spaceship-earth/'));await until(()=>frame.contentDocument?.querySelector('#map')?.dataset.tourLayout==='dancing'&&frame.contentDocument.querySelector('#map').dataset.surfacePreview==='false','dancing map');
 d=frame.contentDocument;w=frame.contentWindow;const canvas=d.querySelector('#map');canvas.setPointerCapture=()=>{};canvas.releasePointerCapture=()=>{};
 for(let i=0;i<3;i++){d.querySelector('#zoom-in').click();await pause(300);}await pause(600);
 const rect=canvas.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 const drag=async(dx,dy)=>{const ev=(type,x,y)=>canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,clientX:x,clientY:y,pointerId:1,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1}));ev('pointerdown',cx,cy);for(let i=1;i<=10;i++){ev('pointermove',cx+dx*i/10,cy+dy*i/10);await pause(30);}ev('pointerup',cx+dx,cy+dy);await pause(1200);let still=0;for(let i=0;i<30&&still<3;i++){await pause(300);still=canvas.dataset.danceMoving==='false'?still+1:0;}};
 check(canvas.dataset.tourLighting==='lit'&&canvas.dataset.merged==='false','Spaceship Earth draws its lit per-piece sets through the layered renderer');
 for(const [dx,dy] of full?[[0,500],[-500,0],[0,-500],[500,0],[350,350]]:[[0,500],[-500,0]]){
  await drag(dx,dy);const cells=canvas.dataset.dancePositions.split(' ').map(s=>s.split(':')[1].split(',').slice(0,2).join());
  const posNow=()=>Object.fromEntries(canvas.dataset.dancePositions.split(' ').map(s=>{const [id,rest]=s.split(':');return [id,rest.split(',').map(Number)];}));
  const [aid,ck]=canvas.dataset.danceVertex.split(':'),three=(()=>{const p=posNow();const a=p[aid];return Object.entries(p).filter(([id,q])=>id!==aid&&Math.abs(Math.hypot(q[0]-a[0],q[1]-a[1])-Math.sqrt(3))<.01).length;})();
  check(canvas.dataset.danceEyeEmpty==='false','After a drag of '+dx+','+dy+' the cell under the eye holds a piece');
  check(canvas.dataset.danceValid==='true'&&new Set(cells).size===4&&three>=2,`After a drag of ${dx},${dy} three plates meet at the vertex nearest the centre, every piece touches the group along a valid edge and no two share a cell (valid ${canvas.dataset.danceValid}, cells ${new Set(cells).size}, adjacent ${three}, vertex ${canvas.dataset.danceVertex}, positions ${canvas.dataset.dancePositions})`);
 }
 // The rotation dial beside Fit turns the map in 15° steps.
 const dial=d.querySelector('#rotate-dial'),rotation=()=>+d.querySelector('#gridRotation').value;dial.setPointerCapture=()=>{};
 check(dial.style.getPropertyValue('--dial')===rotation()+'deg','The dial dot shows the map\u2019s turn from the start');
 const dr=dial.getBoundingClientRect(),dcx=dr.left+dr.width/2,dcy=dr.top+dr.height/2,before=rotation();
 const dev=(type,x,y)=>dial.dispatchEvent(new w.PointerEvent(type,{bubbles:true,clientX:x,clientY:y,pointerId:7,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1}));
 dev('pointerdown',dcx+14,dcy);for(let i=1;i<=6;i++){dev('pointermove',dcx+14*Math.cos(i*Math.PI/12),dcy+14*Math.sin(i*Math.PI/12));await pause(40);}dev('pointerup',dcx,dcy+14);await pause(300);
 check(getComputedStyle(dial).display!=='none'&&dial.previousElementSibling.id==='fit'&&rotation()===before+90&&dial.style.getPropertyValue('--dial')===rotation()+'deg',`Dragging a quarter turn around the dial turns the map a quarter turn in 30° steps and moves the dot (before ${before}, after ${rotation()}, dot ${dial.style.getPropertyValue('--dial')}, display ${getComputedStyle(dial).display}, prev ${dial.previousElementSibling.id})`);
 dial.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await pause(200);
 check(rotation()===before+60,'Arrow keys step the dial by 30°');
 // Turning the map with the dial must not stop the dance: a drag afterwards still completes a vertex.
 await drag(0,-500);
 check(canvas.dataset.tourLayout==='dancing'&&canvas.dataset.danceValid==='true','The dance keeps going after the map is turned');
 result.textContent=(full?'All checks passed.':'Quick checks passed; add ?full=1 for every period and direction.');result.dataset.status='passed';
}catch(error){result.textContent='FAIL: '+error.message;result.dataset.status='failed';console.error(error);}
</script></html>
