<!doctype html><html lang="en"><meta charset="utf-8"><title>Tour URL checks</title>
<style>body{font:14px system-ui;color:#234b59}iframe{width:1100px;height:760px;border:1px solid #ccc}#checks{max-height:180px;overflow:auto}</style>
<h1>Tour URL checks</h1><p id="result">Running…</p><ol id="checks"></ol><iframe title="Tour navigation map"></iframe>
<script type="module">
import {tourPages} from '../tour-pages.mjs';
import {periods} from '../history/index.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
if(new URLSearchParams(location.search).has('mobile')){frame.style.width='390px';frame.style.height='844px';}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function wait(test,label){for(let i=0;i<300;i++){if(test())return;await pause(100);}throw Error('Timed out: '+label);}
const check=(ok,text)=>{if(!ok)throw Error(text);const li=document.createElement('li');li.textContent='PASS: '+text;document.querySelector('#checks').append(li);};
const load=async path=>{const loaded=new Promise(r=>frame.onload=r);frame.src=path;await loaded;};
const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
const visible=selector=>[...doc().querySelectorAll(selector)].filter(el=>getComputedStyle(el.parentNode).display!=='none');
try{
 // Every story URL opens the map on Lifezones with the timeline at that story's first period and its card open.
 for(const tour of tourPages){
  await load(tour.path);await wait(()=>doc()?.querySelector('#tour-story')?.hidden===false,'story '+tour.id);await pause(2200);
  const first=periods.find(p=>p.stories.includes(tour.id));
  await wait(()=>win().location.pathname.startsWith('/history/'),'history address');
  check(doc().querySelector('#map-source').value==='ecology',tour.path+' directly opens on Lifezones · Spaceship Earth');
  check(doc().querySelector('#show-history').getAttribute('aria-pressed')==='true'&&!doc().querySelector('.history-tools').hidden&&win().location.pathname==='/history/'+first.id+'/'+tour.id+'/',tour.path+' opens the timeline at '+first.id);
  check(visible('.tour-routes .route-line').length>0,tour.path+' draws the period without clicking');
  check(doc().querySelector('#tour-story-title').textContent.length>0&&doc().querySelectorAll('#tour-story .tour-story-body p').length>0,tour.path+' shows the spot text');
  await wait(()=>doc().querySelector('#map').dataset.tourLayout==='dancing','dancing pieces');
  doc().querySelector('#tour-story-close').click();await wait(()=>doc().querySelector('#tour-story').hidden,'close');await pause(300);
  check(doc().querySelector('#show-history').getAttribute('aria-pressed')==='true'&&visible('.tour-routes .route-line').length>0&&win().location.pathname==='/history/'+first.id+'/',tour.path+' closes to the timeline, still drawn, on the age address');
 }
 await load('/lifezones/spaceship-earth/');await wait(()=>doc().querySelectorAll('.tour-marker:not([hidden])').length===7,'base map');
 doc().querySelector('[data-tour-id="french-polynesia"]').click();await wait(()=>doc().querySelector('#tour-story')?.hidden===false,'dot');await pause(1500);
 const first=periods.find(p=>p.stories.includes('french-polynesia'));
 check(doc().querySelector('#show-history').getAttribute('aria-pressed')==='true'&&win().location.pathname==='/history/'+first.id+'/french-polynesia/','A dot off the timeline switches history on at that story’s first period');
 result.textContent='All checks passed.';result.dataset.status='passed';
}catch(error){result.textContent='FAIL: '+error.message;result.dataset.status='failed';console.error(error);}
</script></html>
