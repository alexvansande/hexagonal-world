const result=document.querySelector('#result'),size=480,extent=6,root=Math.sqrt(3),dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]],pos=([q,r])=>[1.5*q,root*(r+q/2)],add=(a,b)=>a.map((v,i)=>v+b[i]),colors=['#42ad61','#5d88c9','#e0b358'];

 for(const c of cells){poly(ctx,hex.map(p=>add(p,c.center)),c.color);poly(sourceCtx,hex.map(p=>add(p,c.center)),c.color);}
 // Literal painter's algorithm: complete hexes, pair rectangles, then triple

 for(const c of cells)for(let i=0;i<3;i++)if(!affected(c.axial)&&!affected(add(c.axial,dirs[i]))&&c.color===classification(add(c.axial,dirs[i])))poly(ctx,rectangle(c.center,pos(dirs[i]),root,.75),c.color);
 const patches=[];
 for(const c of cells)for(let i=0;i<6;i++){
  const values=[i,(i+1)%6,(i+2)%6].map(j=>classification(add(c.axial,dirs[j])));
  if(values[0]!==c.color&&values.every(v=>v===values[0])){const polygon=rectangle(c.center,pos(dirs[(i+1)%6]),root,1);patches.push({origin:c,polygon,color:values[0]});}
 }
 // Exclusivity is cell-wide: remove all pair contributions from cells with

 const overlaps=(a,b)=>[...a,...b].every((p,i,all)=>{const polygon=i<a.length?a:b,j=i<a.length?i:i-a.length,next=polygon[(j+1)%polygon.length],axis=[p[1]-next[1],next[0]-p[0]],project=poly=>poly.map(v=>v[0]*axis[0]+v[1]*axis[1]),x=project(a),y=project(b);return Math.min(Math.max(...x),Math.max(...y))-Math.max(Math.min(...x),Math.min(...y))>1e-8;});
 const qualifying=new Set();

 for(const p of patches)poly(ctx,p.polygon,p.color);
 for(const c of cells)if(dirs.every(d=>classification(add(c.axial,d))!==c.color)&&qualifying.has(key(c.axial))){ctx.beginPath();ctx.arc(...c.center,root/2,0,2*Math.PI);ctx.fillStyle=colors[c.color];ctx.fill();}
 const gl=document.querySelector('#gpu').getContext('webgl',{preserveDrawingBuffer:true,antialias:false});

 vec2 geographicUV(vec3 p,vec3 angles){return (p.xy+24.)/48.;}
 ${ecologyBridgeGLSL}
 void main(){vec2 p=point*6.;vec3 cube=vec3(2.*p.x/3.,-p.x/3.+p.y/sqrt(3.),0.);cube.z=-cube.x-cube.y;vec3 rounded=floor(cube+.5),error=abs(cube-rounded);if(error.x>error.y&&error.x>error.z)rounded.x=-rounded.y-rounded.z;else if(error.y>error.z)rounded.y=-rounded.x-rounded.z;

 gl.uniform1i(gl.getUniformLocation(program,'ecologyBridges'),2);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const attr=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,0,0);
 gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());for(const setting of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,setting,gl.NEAREST);for(const setting of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,setting,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 const actual=new Uint8Array(size*size*4),expected=ctx.getImageData(0,0,size,size).data;gl.readPixels(0,0,size,size,gl.RGBA,gl.UNSIGNED_BYTE,actual);const rgb=colors.map(c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)));let checked=0,mismatch=0;
 for(let y=2;y<size-2;y++)for(let x=2;x<size-2;x++){
  const i=(y*size+x)*4,j=((size-1-y)*size+x)*4;if(!rgb.some(c=>c.every((v,k)=>expected[i+k]===v)))continue;
  // Exclude anti-aliased primitive edges from this exact-color comparison.
  if([-size,size,-1,1].some(d=>[0,1,2].some(k=>expected[i+k]!==expected[i+4*d+k])))continue;
  checked++;if([0,1,2].some(k=>Math.abs(actual[j+k]-expected[i+k])>1))mismatch++;
 }
 result.textContent=(mismatch?'FAIL':'PASS')+' · '+mismatch+' mismatches across '+checked+' interior pixels; whole-grid drawing tests patch overlap, cell boundaries and circle precedence.';
}catch(error){result.textContent='FAIL · '+error.message;console.error(error);}
