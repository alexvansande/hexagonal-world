<!doctype html><html lang="en"><meta charset="utf-8"><title>History timeline checks</title>
<style>body{font:14px system-ui;color:#18343d}iframe{width:1100px;height:800px;border:1px solid #ccc}li{margin:4px}</style>
<h1>History timeline</h1><p id="result">Running…</p><ol id="checks"></ol>
<iframe title="Tour map" src="/lifezones/spaceship-earth/"></iframe>
<script type="module">
import {periods} from '../history/index.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),mobile=new URLSearchParams(location.search).has('mobile');
if(mobile){frame.style.width='390px';frame.style.height='844px';}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test,label)=>{for(let i=0;i<400;i++){if(test())return;await pause(50);}throw Error('Timed out: '+label);};
const check=(ok,label)=>{if(!ok)throw Error(label);const li=document.createElement('li');li.textContent='PASS: '+label;document.querySelector('#checks').append(li);};
try{
 await until(()=>frame.contentDocument?.querySelectorAll('.tour-marker:not([hidden])').length===7,'map');
 let d=frame.contentDocument,w=frame.contentWindow;await pause(400);
 const toggle=d.querySelector('#show-history'),tools=d.querySelector('.history-tools'),routes=d.querySelector('.tour-routes'),viewTools=d.querySelector('.view-tools'),map=d.querySelector('#map');
 const visible=()=>[...routes.querySelectorAll('g[data-route-id]')].filter(g=>g.style.display!=='none');
 const dots=()=>[...d.querySelectorAll('.tour-marker:not([hidden])')].map(b=>b.dataset.tourId);
 const drawn=()=>visible().map(g=>g.dataset.routeId).sort().join();
 const scrub=async id=>{const previous=drawn();d.querySelector('#history-stop').value=periods.findIndex(p=>p.id===id);d.querySelector('#history-stop').dispatchEvent(new w.Event('input',{bubbles:true}));await until(()=>drawn()!==previous,'settled '+id);await pause(250);};
 check(getComputedStyle(d.querySelector('#history-toggle')).display!=='none'&&tools.hidden,'Show history checkbox sits in the collapsed sidebar; scrubber hidden');
 check(!w.performance.getEntriesByType('resource').some(r=>/\/history\/.*\.(md|json)$/.test(r.name)),'No period data before enabling history');
 toggle.click();await until(()=>!tools.hidden&&visible().length>0,'history routes');await pause(600);
 check(getComputedStyle(viewTools).display==='none'&&!tools.hidden,'Scrubber replaces the positioning toolbox');
 const slider=d.querySelector('#history-stop');check(slider.max===String(periods.length-1)&&d.querySelectorAll('.history-stop-labels button').length===periods.length,'One tick per period');
 await until(()=>w.location.search.includes('history=1000-ce'),'default period in URL');check(true,'URL carries the default period');
 const middle=periods.find(p=>p.id==='1000-ce');
 check(new Set(visible().map(g=>g.dataset.routeId.split('-')[0])).size>=3,'Middle Ages draws several stories at once');
 check(dots().length===middle.stories.length&&middle.stories.every(id=>dots().includes(id)),'Story dots are the period spots');
 check(!!d.querySelector('#wave-colours')&&getComputedStyle(visible()[0]).getPropertyValue('--route-color').trim().startsWith('#'),'Wave colours come from history/waves.json');
 // Detail routes appear only when zoomed in, and hide again.
 const overview=visible().length;for(let i=0;i<3;i++)d.querySelector('#zoom-in').click();await pause(500);
 check(visible().length>overview,'Regional detail routes appear when zoomed in');
 for(let i=0;i<3;i++)d.querySelector('#zoom-out').click();await pause(500);
 check(visible().length===overview,'Detail routes hide again when zoomed out');
 const counts=[];
 for(const p of periods){
  await scrub(p.id);counts.push(visible().length);
  check(w.location.search.includes('history='+p.id),'URL preserves '+p.id);
  check(d.querySelector('#history-date').textContent===`${p.label} · ${p.date}`&&d.querySelector(`.history-stop-labels button[data-stop="${p.id}"]`).textContent===p.tick,'Date and tick for '+p.id);
  check(visible().length>0&&dots().length>0&&dots().every(id=>p.stories.includes(id)),'Routes and spots for '+p.id+' (the headline focus may frame some dots out of view)');
  check(map.dataset.tourLayout==='dancing','Dancing pieces stay on for '+p.id);
 }
 check(new Set(counts).size>=6,'Periods draw different networks: '+counts.join(','));
 check(routes.querySelectorAll('path').length<1200,'Route DOM stays bounded while scrubbing');
 // Choosing a date activates the period's headline spot: the card opens on the first story of its Markdown.
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes('Galleons'),'A story focused at 1600 CE continues at 1800 CE instead of switching');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close auto');await pause(1500);
 await scrub('1600-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('Iberian'),'Globalization opens on the ocean crossings');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1600');await pause(1500);
 await scrub('1800-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('slave trade'),'Plantations & empires opens on the Atlantic slave trade');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1800');await pause(1500);
 // A dot frames its story for the period and shows the spot text; nothing else changes.
 await scrub('1400-ce');await pause(1300);d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 1400');await pause(1500);
 const drawnBefore=visible().length,zoomBefore=d.querySelector('#zoom-value').textContent;
 d.querySelector('.tour-marker[data-tour-id="silk-road"]').click();await until(()=>!d.querySelector('#tour-story').hidden,'story');await pause(1500);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol')&&!d.querySelector('.tour-timeline')&&!d.querySelector('.tour-flow-toggle'),'Dot shows the Silk Road 1400 CE text with no second slider or pause button');
 check(!tools.hidden&&visible().length>=drawnBefore&&!d.querySelector('.history-tools button[id]'),'The scrubber and every story stay while a story is focused; no chips');
 check(d.querySelector('#zoom-value').textContent!==zoomBefore&&w.location.pathname==='/lifezones/spaceship-earth/','Focusing zooms to the story and keeps the map URL');
 check(d.querySelectorAll('#tour-story .tour-route-key li[data-wave]').length>0,'The card lists the waves drawn for that story');
 const labels=()=>[...d.querySelectorAll('.tour-labels .tour-label:not([hidden])')];
 check(labels().some(l=>l.dataset.kind==='site'&&l.textContent==='Samarkand')&&labels().some(l=>l.dataset.kind==='area'&&l.textContent==='Steppe'),'Site and area labels of the focused story are drawn');
 check(getComputedStyle(labels().find(l=>l.dataset.kind==='site')).textTransform==='uppercase'&&getComputedStyle(labels().find(l=>l.dataset.kind==='area')).fontStyle==='italic','Sites are all caps, areas italic');
 check(parseFloat(getComputedStyle(d.querySelector('.tour-routes .route-line')).strokeWidth)>=7,'Traffic dots are twice their former size');
 // Framing a story picks the band that gathers it: the Pacific for Polynesia, the diagonal for the Atlantic.
 // (Stepping with the card's arrow: a dot framed out of view cannot be clicked.)
 d.querySelector('.tour-story-next').click();await pause(2000);await until(()=>map.dataset.danceMoving==='false','pieces settle');
 check(d.querySelector('#tour-story-title').textContent.includes('Contact')&&map.dataset.danceMode==='pacific','Focusing the Polynesian contact story brings the Americas to the Pacific');
 d.querySelector('.tour-story-next').click();await pause(2000);await until(()=>map.dataset.danceMoving==='false','pieces settle again');
 check(d.querySelector('#tour-story-title').textContent.includes('Vinland')&&map.dataset.danceMode==='base','Focusing the Vinland voyages returns to the Atlantic band');
 d.querySelector('.tour-story-next').click();await pause(1200);d.querySelector('.tour-story-next').click();await pause(2000);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Cycling on returns to the Silk Road');
 // Arrows at the bottom of the card cycle through the period's spots.
 check(!d.querySelector('.tour-story-nav').hidden&&d.querySelector('.tour-story-nav output').textContent==='1 / 4','The card shows its place among the period\u2019s spots');
 d.querySelector('.tour-story-next').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Contact')&&d.querySelector('.tour-story-nav output').textContent==='2 / 4','Next arrow moves to the following spot');
 d.querySelector('.tour-story-prev').click();await pause(400);d.querySelector('.tour-story-prev').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Kilwa')&&d.querySelector('.tour-story-nav output').textContent==='4 / 4','Previous arrow wraps around to the last spot');
 d.querySelector('.tour-story-next').click();await pause(1600);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Cycling returns to the first spot');
 await scrub('1000-ce');
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes('caravans'),'Scrubbing re-reads the focused story at the new period');
 // A spot without routes frames its view box instead.
 await scrub('50k-ya');await pause(600);d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'close 50k');await pause(1500);
 const zoomWide=d.querySelector('#zoom-value').textContent;d.querySelector('.tour-marker[data-tour-id="island-hominins"]').click();await until(()=>!d.querySelector('#tour-story').hidden,'island spot');await pause(1600);
 const flores=d.querySelector('.tour-marker[data-tour-id="island-hominins"]').getBoundingClientRect();
 check(d.querySelector('#tour-story-title').textContent.includes('floresiensis')&&d.querySelector('#zoom-value').textContent!==zoomWide&&!flores.width===false&&flores.left>0&&flores.top>0&&flores.right<frame.clientWidth&&flores.bottom<frame.clientHeight,'A highlight spot without routes frames its view box (Flores stays on screen)');
 await scrub('2m-ya');await pause(600);
 check(!d.querySelector('#tour-story').hidden&&d.querySelector('#tour-story-title').textContent.includes('Early Homo'),'A period without that story activates its first spot instead');
 await scrub('1400-ce');await pause(1300);
 check(d.querySelector('#tour-story-title').textContent.includes('Mongol'),'Back at 1400 CE the headline spot is the Silk Road');
 d.querySelector('#tour-story-close').click();await until(()=>d.querySelector('#tour-story').hidden,'back');await pause(1500);
 check(d.querySelector('.tour-labels').hidden,'Labels leave with the card');
 check(w.location.search.includes('history=1400-ce')&&visible().length>0&&d.querySelector('#zoom-value').textContent===zoomBefore,'Closing the card restores the camera at the same period');
 toggle.click();await until(()=>tools.hidden&&routes.style.display==='none'&&dots().length>0,'off');await pause(200);
 check(dots().every(id=>['origin-of-mankind','silk-road','iceland-to-vinland','french-polynesia','americas-exchange','african-networks','ocean-crossings'].includes(id))&&!d.querySelector('.tour-marker[data-tour-id="neanderthals"]:not([hidden])'),'Off the timeline only the seven entry dots remain (some may sit off screen after the dance)');
 check(getComputedStyle(viewTools).display!=='none'&&!w.location.search.includes('history='),'Unchecking restores the toolbox, dots and URL');
 // Direct URL entry restores the period, including an older stop name.
 frame.src='/lifezones/spaceship-earth/?history=bronze-age';await until(()=>frame.contentDocument?.querySelector('.history-tools')&&!frame.contentDocument.querySelector('.history-tools').hidden,'reload');
 d=frame.contentDocument;w=frame.contentWindow;await until(()=>[...d.querySelectorAll('.tour-routes g[data-route-id]')].some(g=>g.style.display!=='none'),'reload routes');await until(()=>w.location.search.includes('history=3k-ya'),'rewritten stop name');
 check(d.querySelector('#history-date').textContent.endsWith('c. 1000 BCE'),'Reload restores the Bronze Age period from its old stop name');
 // A story URL opens the timeline focused on that story.
 frame.src='/iceland-to-vinland/';await until(()=>frame.contentDocument?.querySelector('#tour-story')?.hidden===false,'story URL');await pause(1800);
 d=frame.contentDocument;w=frame.contentWindow;const first=periods.find(p=>p.stories.includes('iceland-to-vinland'));
 await until(()=>w.location.search.includes('history='+first.id),'story period in URL');
 check(!d.querySelector('.history-tools').hidden&&d.querySelector('#tour-story-title').textContent.length>0&&[...d.querySelectorAll('.tour-marker:not([hidden])')].some(b=>b.dataset.tourId==='iceland-to-vinland'),'Story URL opens the timeline at the Vikings’ first period with the card open');
 result.textContent='All checks passed.';result.dataset.status='passed';
}catch(error){result.textContent='FAIL: '+error.message;result.dataset.status='failed';console.error(error);}
</script></html>
