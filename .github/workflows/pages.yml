name: Test and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image release and fetch binary test inputs
        run: node scripts/prepare-remote-tests.mjs
      - name: Run regression tests
        run: npm test
        env:
          REMOTE_ASSET_TESTS: '1'
      - name: Prepare public files
        run: |
          export MAP_ASSET_BASE_URL="$(node -p 'JSON.parse(require("fs").readFileSync("asset-release.json")).baseURL')"
          node scripts/build-external-site.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
