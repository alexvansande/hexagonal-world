<!doctype html><html><head><meta charset="utf-8"><title>Connected hexes experiment</title><style>
body{margin:0;background:#d9d3d3;color:#193c49;font:14px system-ui}header{height:64px;box-sizing:border-box;padding:10px 20px;display:flex;align-items:center;gap:20px}h1{font-size:18px;margin:0}p{margin:0}button,a{color:inherit}button{padding:8px 12px}iframe{border:0;width:100%;height:calc(100vh - 64px)}
</style></head><body><header><h1>Connected hexes</h1><button id="toggle">Show original hexes</button><p id="status">Preparing close-up…</p></header><iframe title="Interactive hex bridge preview"></iframe><script type="module">
import {encodeMapState,decodeMapState} from '../map-state.mjs';
const frame=document.querySelector('iframe'),button=document.querySelector('button'),status=document.querySelector('#status');let bridged=true,first=true;
frame.src='../index.html?hex-bridges=1';
const delay=ms=>new Promise(r=>setTimeout(r,ms));
frame.onload=async()=>{
 const win=frame.contentWindow,doc=win.document;
 for(let i=0;i<600;i++){if(doc.querySelector('.style-preset-card')&&!doc.querySelector('#map-loading').textContent&&win.location.hash)break;await delay(100);}
 if(first){first=false;
  // Keep the view focused on the center of a populated map, without lighting
  // and decorative grids obscuring the cell boundary comparison.
  const saved=decodeMapState(win.location.hash.slice(3));saved.controls['relief-enabled']=false;saved.controls['rivers-visible']=false;saved.controls.subgrid=false;saved.controls.dotgrid=false;saved.state.reliefColorFade=0;
  saved.view.zoom=12;saved.view.panX*=12;saved.view.panY*=12;
  frame.src='../index.html?hex-bridges=1#m='+encodeMapState(saved);return;
 }
 status.textContent=bridged?'Same-color bridges · pan to explore':'Original hexes · pan to explore';
};
button.onclick=()=>{bridged=!bridged;button.textContent=bridged?'Show original hexes':'Show connected hexes';frame.src='../index.html?hex-bridges='+(bridged?'1':'0')+frame.contentWindow.location.hash;};
</script></body></html>
