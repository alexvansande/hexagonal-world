<!doctype html><html lang="en"><meta charset="utf-8"><title>Norse voyage chapter checks</title>
<style>body{font:14px system-ui;color:#18343d}iframe{width:1100px;height:760px;border:1px solid #ccc}li{margin:5px}</style>
<h1>Norse voyage chapters</h1><p id="result">Running…</p><ol id="checks"></ol>
<iframe title="Tour map" src="/lifezones/spaceship-earth/"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),params=new URLSearchParams(location.search);
if(params.has('mobile')){frame.style.width='390px';frame.style.height='844px';}
const wait=async test=>{for(let i=0;i<300;i++){if(test())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');};
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,text)=>{if(!ok)throw Error(text);const li=document.createElement('li');li.textContent='PASS: '+text;document.querySelector('#checks').append(li);};
try{
 await wait(()=>frame.contentDocument?.querySelectorAll('.tour-marker:not([hidden])').length===5);
 const d=frame.contentDocument,win=frame.contentWindow,card=d.querySelector('#tour-story'),areas=d.querySelector('.tour-areas'),routes=d.querySelector('.tour-routes'),close=d.querySelector('#tour-story-close');
 const camera=()=>d.querySelector('#zoom-value').textContent;
 const origin=d.querySelector('[data-tour-id="origin-of-mankind"]'),before=[camera(),origin.style.left,origin.style.top];
 d.querySelector('[data-tour-id="iceland-to-vinland"]').click();await wait(()=>!d.querySelector('.tour-timeline').hidden);await pause(1500);
 check(!card.hidden&&d.querySelector('.tour-story-body p').textContent.length>40,'Norse tour opens its Markdown story');
 check(d.querySelector('[data-style="lifezones"]').getAttribute('aria-pressed')==='true','Norse tour keeps Lifezones');
 check(routes.style.display==='block'&&areas.style.display==='none','Norse tour shows only routes');
 check(d.querySelector('.tour-timeline label').textContent==='Voyages through time'&&d.querySelectorAll('.tour-period-labels button').length===5,'Five named chapters');
 const slider=d.querySelector('#tour-period');check(slider.max==='4'&&slider.value==='4','Default chapter is the Iceland to Vinland story');
 const visible=()=>[...routes.querySelectorAll('g[data-route-id]')].filter(g=>g.style.display!=='none');
 check(visible().some(g=>g.dataset.routeId==='norse-vinland')&&visible().some(g=>g.dataset.routeId==='norse-vinland-return'),'Vinland traffic runs both ways');
 for(const i of [0,3]){slider.value=i;slider.dispatchEvent(new win.Event('input',{bubbles:true}));await pause(1500);
  const paths=visible().flatMap(g=>[...g.querySelectorAll('.route-line')]);
  check(paths.every(p=>{const r=p.getBoundingClientRect();return r.width>0&&r.left>=0&&r.right<=win.innerWidth+1&&r.top>=0&&r.bottom<=win.innerHeight+1;}),'Chapter '+i+' fits the viewport');
  check(win.location.search.includes('period='+d.querySelector('.tour-period-labels button[aria-pressed="true"]').dataset.period),'URL preserves chapter '+i);
 }
 check(!visible().some(g=>g.dataset.routeId==='norse-vinland')&&visible().some(g=>g.dataset.routeId==='viking-vinland'),'Kings chapter shows the wider expansion with a single Vinland voyage');
 const rect=d.querySelector('#controls').getBoundingClientRect();
 check(rect.top>=0&&rect.right<=win.innerWidth&&close.getBoundingClientRect().height>=44,'Card fits and has an accessible close button');
 close.click();await wait(()=>card.hidden&&routes.style.display==='none');
 check(JSON.stringify([camera(),origin.style.left,origin.style.top])===JSON.stringify(before),'Close restores the previous camera exactly');
 check(d.querySelectorAll('.tour-marker:not([hidden])').length===5,'Closing restores the five discovery dots');
 d.querySelector(`[data-tour-id="${params.get('tour')||'iceland-to-vinland'}"]`).click();await pause(2500);
 result.textContent='All checks passed. Norse tour left open for visual review.';
}catch(error){result.textContent='FAIL: '+error.message;}
</script></html>
