<!doctype html><html lang="en"><meta charset="utf-8"><title>Trade period checks</title>
<style>body{font:14px system-ui;color:#18343d}iframe{width:1100px;height:800px;border:1px solid #ccc}li{margin:4px}</style>
<h1>Trade periods and deferred loading</h1><p id="result">Running…</p><ol id="checks"></ol>
<iframe title="Tour map" src="/lifezones/spaceship-earth/"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),mobile=new URLSearchParams(location.search).has('mobile');
if(mobile){frame.style.width='390px';frame.style.height='844px';}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test,label)=>{for(let i=0;i<300;i++){if(test())return;await pause(50);}throw Error('Timed out: '+label);};
const check=(ok,label)=>{if(!ok)throw Error(label);const li=document.createElement('li');li.textContent='PASS: '+label;document.querySelector('#checks').append(li);};
try{
 await until(()=>frame.contentDocument?.querySelectorAll('.tour-marker:not([hidden])').length===15,'map');
 let d=frame.contentDocument,w=frame.contentWindow;
 const resources=()=>w.performance.getEntriesByType('resource').map(r=>r.name);
 await pause(500);
 const heavy=/tour-(trade|route-data|area-data|migrations|stories)/;
 check(!resources().some(url=>heavy.test(url)),'No story text, trade, migration or area data loaded before selection');
 const silk=d.querySelector('[data-tour-id="silk-road"]'),before=[silk.style.left,silk.style.top,d.querySelector('#zoom-value').textContent];
 silk.click();d.querySelector('#tour-story-close').click();await pause(600);
 check(d.querySelector('#tour-story').hidden&&d.querySelector('.tour-routes').style.display==='none','Closing during load cannot reopen the story or draw stale routes');
 silk.click();await until(()=>!d.querySelector('.tour-timeline').hidden,'periods');await pause(1500);
 check(resources().some(url=>url.includes('tour-trade-periods')),'Opening trade loads its data');
 check(!resources().some(url=>/tour-(area-data|migrations)/.test(url)),'Opening trade does not load other tour datasets');
 const slider=d.querySelector('#tour-period'),routes=d.querySelector('.tour-routes');
 const visible=()=>[...routes.querySelectorAll('g[data-route-id]')].filter(g=>g.style.display!=='none');
 const sets=[];
 for(const [i,id] of ['bronze-age','antiquity','early-middle-ages','high-middle-ages'].entries()){
  slider.value=i;slider.dispatchEvent(new w.Event('input',{bubbles:true}));await pause(1500);
  sets.push(visible().map(g=>g.dataset.routeId).join(','));
  check(w.location.search.includes('period='+id),'URL preserves '+id);
  check(slider.getAttribute('aria-valuetext').includes(['1300 BCE','150 CE','900 CE','1300 CE'][i]),'Accessible date for '+id);
  const palette=new Set(visible().map(g=>g.dataset.wave));check(palette.size===d.querySelectorAll('.tour-route-key li').length,'Legend matches '+id);
  const boxes=visible().flatMap(g=>[...g.querySelectorAll('.route-line')].map(p=>p.getBoundingClientRect()));
  check(boxes.every(r=>r.left>=0&&r.right<=w.innerWidth+1&&r.top>=0&&r.bottom<=w.innerHeight+1),'Routes fit viewport: '+id);
  const panel=d.querySelector('#controls').getBoundingClientRect();check(panel.top>=0&&panel.right<=w.innerWidth,'Story fits viewport: '+id);
  if(mobile)check(panel.height<=w.innerHeight*.49,'Scrollable story leaves space for map');
 }
 check(new Set(sets).size===4,'Four genuinely different networks');
 d.querySelector('.tour-flow-toggle').click();
 slider.value=0;slider.dispatchEvent(new w.Event('input',{bubbles:true}));
 check(routes.classList.contains('flow-paused')&&d.querySelector('.tour-flow-toggle').textContent==='Resume flow','Period changes preserve Pause');
 check(d.querySelectorAll('.tour-marker:not([hidden])').length===1,'Only the selected discovery dot is visible');
 // Reload the actual period URL, then exercise Back/Forward to the original map.
 const url=w.location.href;frame.src=url;await until(()=>frame.contentDocument?.querySelector('#tour-period')?.value==='0'&&!frame.contentDocument.querySelector('.tour-timeline').hidden,'reload');await pause(1500);
 d=frame.contentDocument;w=frame.contentWindow;
 check(d.querySelector('#tour-story-title').textContent.includes('bronze'),'Reload restores selected Bronze Age period');
 d.querySelector('#tour-story-close').click();await until(()=>frame.contentDocument.querySelector('#tour-story').hidden,'close');await pause(100);
 check(d.querySelectorAll('.tour-marker:not([hidden])').length===15,'Closing restores all markers');
 // Reopen and leave the latest period visible for visual review.
 d.querySelector('[data-tour-id="silk-road"]').click();await until(()=>!d.querySelector('.tour-timeline').hidden,'reopen');
 d.querySelector('[data-period="high-middle-ages"]').click();await pause(1500);
 result.textContent='All checks passed.';result.dataset.status='passed';
}catch(error){result.textContent='FAIL: '+error.message;result.dataset.status='failed';console.error(error);}
</script></html>
